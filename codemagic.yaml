# Fix: "android" folder does not exist" error aur dependency issues ko theek karne ke liye
# ek nayi approach.

workflows:
  android_apk:
    name: Build Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      android: true
    scripts:
      - name: Ensure Flutter folders exist
        script: |
          echo "Running flutter create . to generate platform folders..."
          flutter create .
      - name: Overwrite pubspec.yaml with a clean version
        script: |
          cat <<EOF > pubspec.yaml
name: yash_fashion_hub
description: A new Flutter project for Yash Fashion Hub
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
